name: market-lens-backend
services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: django
    env_file:
      - .env
    ports:
      - ${PORT}:8000
    volumes:
      - ./backend:/app
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      database:
        condition: service_healthy
      search_engine:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=${DATABASE_HOST}
      - POSTGRES_PORT=${DATABASE_PORT}
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - DEBUG=${DEBUG}
      - MEILI_URL=${MEILI_URL}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - DATABASE_URL=${DATABASE_URL}
      
    networks:
      - market_lens_network
    restart: always
  
  database:
    image: 'postgres:18-alpine'
    env_file:
      - .env
    container_name: market_lens_db
    ports:
      - ${DATABASE_PORT}:5432
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_HOST=${DATABASE_HOST}
      - POSTGRES_PORT=${DATABASE_PORT}
      - DATABASE_URL=${DATABASE_URL}
    healthcheck:
      test: ["CMD", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME} -h ${DATABASE_HOST} -p ${DATABASE_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 6

    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - market_lens_network
    restart: always

  offer_crawler:
    build:
      context: .
      dockerfile: offer_crawler/Dockerfile
    container_name: offer_crawler
    working_dir: /app
    command: sh -c "scrapy crawl badrgrb -o exports/products.json && scrapy crawl frensia -o exports/products.json && scrapy crawl hardwaremarket -o exports/products.json && scrapy crawl sigma -o exports/products.json"
    depends_on:
      - database
      - search_engine
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./offer_crawler/exports:/app/exports
      - ./offer_crawler:/app
    networks:
      - market_lens_network
    restart: always
  
  search_engine:
    image: 'getmeili/meilisearch:v1.43.0'
    env_file:
      - .env
    container_name: market_lens_meilisearch
    ports:
      - ${MEILI_PORT:-7700}:7700
    volumes:
      - ./meili_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 1m30s
      timeout: 30s
      retries: 6
      start_period: 30s
    networks:
      - market_lens_network
    restart: always

volumes:
  database_data:
  meili_data:

networks:
  market_lens_network:
    driver: bridge